<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/AdminStyle.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css" rel="stylesheet">

    <title>Gestionar Reservas - DeporPlaza</title>
</head>

<body>
    <header>
        <div id="header-left">
            <button id="btn-menu">
                <i class="bi bi-list"></i>
            </button>
            <p>Sistema DeporPlaza</p>

        </div>
        <div id="header-right">
            <a th:if="${usuarioLogueado == null}" th:href="@{/login}" id="btn-login"
                class="btn-bar btn-resaltado">Ingresa Ya!</a>
            <p th:if="${usuarioLogueado != null}" id="text-logueado" th:text="${usuarioLogueado.nombreCompleto}"></p>

            <form th:if="${usuarioLogueado != null}" th:action="@{/logout}" id="logoutForm" method="post">
                <button id="dropbox-perfil" type="submit" th:onclick="salir()">
                    <i class="bi bi-file-person-fill"></i>
                </button>
            </form>
        </div>
    </header>
    <main>
        <aside id="aside" class="">
            <nav>
                <a th:href="@{/admin/dashboard}" class="btn-nav"><i class="bi bi-pie-chart-fill"></i>
                    <p>Dashboard</p>
                </a>
                <a th:href="@{/admin/reservas}" class="btn-nav"><i class="bi bi-ticket-fill"></i>
                    <p>Gestionar Reservas</p>
                </a>
                <a href="" class="btn-nav" th:href="@{/admin/reporteExcel}"><i class="bi bi-file-earmark-text-fill"></i>
                    <p>Reportes</p>
                </a>
                <a href="" class="btn-nav"><i class="bi bi-stack"></i>
                    <p>Gestionar Campos D. </p>
                </a>

                <a href="" class="btn-nav"><i class="bi bi-calendar-fill"></i>
                    <p>Ver Calendario</p>
                </a>
                <a href="" class="btn-nav"><i class="bi bi-person-fill-gear"></i>
                    <p>Gestionar Usuarios</p>
                </a>
                <a class="btn-nav"><i class="bi bi-box-arrow-left"></i>
                    <p>Cerrar Sesion</p>

                </a>
            </nav>
        </aside>
        <section>
            <div class="title-form">Registrar Reserva</div>
            <div class="bloque">
                <form th:object="${reserva}" class="formulario" id="reservaForm" method="post">
                    <div class="mb-3 input-dni">
                        <label class="form-label">DNI</label>
                        <div class="input-group">
                            <input type="text" placeholder="DNI" id="dni" class="form-control"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="8" pattern="[0-9]{8}"
                                required>
                            <input type="hidden" id="dniCliente" name="dniCliente">
                            <button class="btn btn-outline-secondary" type="button" onclick="buscarDni()"><i
                                    class="bi bi-search"></i></button>
                        </div>
                    </div>
                    <div class="mb-3 input-nombres">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" placeholder="Ingrese su DNI" class="form-control" id="nombreCompleto"
                            required readonly tabindex="-1">
                    </div>
                    <div class="mb-3 input-campo">
                        <label class="form-label">Campo Deportivo</label>
                        <select class="form-select" name="idCampo" id="campo" required>
                            <option value="" disabled selected>---Elegir---</option>
                            <option th:each="p:${campos}" th:value="${p.idCampo}" th:text="${p.nombreCampo}"
                                th:data-precio="${p.precioHora}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3 input-precio">
                        <label class="form-label">Precio por Hora</label>
                        <input type="number" placeholder="Seleccione el Campo Deportivo" class="form-control"
                            id="precio" required readonly tabindex="-1">
                    </div>
                    <div class="mb-3 input-fecha">
                        <label class="form-label">Fecha de Reserva</label>
                        <input type="text" th:field="*{fechaReserva}" class="form-control" id="fecha" required readonly
                            tabindex="-1" placeholder="Seleccione una fecha...">
                    </div>
                    <div class="mb-3 input-horario">
                        <label class="form-label">Horario Elegido</label>
                        <input type="text" class="form-control" id="horario" required readonly tabindex="-1"
                            placeholder="Seleccione un horario...">
                        <input type="text" id="idHorario" name="idHorario" readonly hidden>

                    </div>
                    <div class="mb-3 input-observaciones">
                        <label class="form-label">Observaciones</label>
                        <textarea th:field='*{observaciones}' class="form-control">

                        </textarea>

                    </div>
                    <div class="mb-3 btn-contenedor">
                        <button class="btn btn-success">Registrar</button>
                        <button class="btn btn-danger">Limpiar</button>
                    </div>
                    <div class='calendar-contenedor'>
                        <div id="calendar"></div>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- SCRIPT DE BOOSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
    <script th:inline="javascript">
        const listaHorarios = [[${ horarios }]];
        const listaCampos = [[${ campos }]];
        let campoSeleccionado = null;
        let calendar
        console.log(listaCampos);
    </script>
    <script>
        // CODIGO PARA GENERACION DE CALENDARIO
        document.addEventListener('DOMContentLoaded', function () {

            const calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {

                initialView: 'timeGridWeek',

                locale: 'es',

                events: function (info, successCallback, failureCallback) {
                    if (!campoSeleccionado) {
                        successCallback([]);
                        return;
                    }
                    fetch(`/reserva/eventos?idCampo=${campoSeleccionado}`)
                        .then(response => response.json())
                        .then(data => successCallback(data))
                        .catch(error => failureCallback(error));
                },
                allDaySlot: false,
                slotMinTime: '07:00:00',
                slotMaxTime: '23:00:00',
                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                dayHeaderFormat: { weekday: 'long', day: 'numeric' },
                //eventColor: '#198754',
                nowIndicator: true,
                slotDuration: '01:00:00',
                height: 'auto',
                dateClick: function (info) {
                    if (!campoSeleccionado) {
                        Swal.fire({
                            icon: "warning",
                            title: "Campo deportivo no ha sido seleccionado",
                            text: "Debe seleccionar un campo deportivo."
                        });
                        return;
                    }
                    const FechaActual = new Date();
                    if (info.date <= FechaActual) {
                        Swal.fire({
                            icon: "warning",
                            title: "Horario no disponible",
                            text: "No se puede seleccionar una fecha pasada."
                        });
                        return;
                    }
                    const fecha = info.dateStr.split('T')[0];
                    const horaInicio = info.date.toLocaleTimeString('es-PE', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: "2-digit",
                        hour12: false
                    });
                    const horarioSeleccionado = listaHorarios.find(h => h.horaInicio === horaInicio)

                    document.getElementById("fecha").value = fecha;
                    document.getElementById("idHorario").value =
                        horarioSeleccionado.idHorario;
                    document.getElementById("horario").value = horarioSeleccionado.horaInicio.slice(0, 5) + " - " + horarioSeleccionado.horaFin.slice(0, 5)
                    calendar.getEvents().forEach(e => {
                        if (e.extendedProps.placeholder) {
                            e.remove();
                        }
                    });

                    calendar.addEvent({
                        start: info.date,
                        end: new Date(info.date.getTime() + 60 * 60 * 1000),
                        backgroundColor: '#29A36C',
                        textColor: '#fff',
                        editable: false,
                        overlap: false,
                        placeholder: true
                    });

                },
                buttonText: {
                    today: "Hoy",
                    month: 'Mes',
                    week: 'Semana',
                    day: 'Día'
                },
                firstDay: 1,
                eventDrop: function (info) {
                    console.log("Evento movido");
                },


                /*select: function (info) {
                    console.log(info.start)
                    console.log(info.startStr)
                    console.log(info.end)
                    console.log(info.endStr)
                    for(i in info){
                        console.log(i);
                    }
                },
                */
            });

            calendar.render();
        });

    </script>
    <script>
        //CODIGO PARA CERRAR SESION
        const formLogout = document.getElementById("logoutForm")
        formLogout.addEventListener('submit', (e) => {
            e.preventDefault();
            Swal.fire({
                title: "¿Estas seguro?",
                text: "Cerraras la sesion actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#1e7c52",
                cancelButtonColor: "#d33",
                confirmButtonText: "Si, deseo salir"
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById("logoutForm").submit();
                }
            });
        })
        //CODIGO PARA OCULTAR ASIDE
        const btnMenu = document.getElementById("btn-menu");
        const aside = document.getElementById("aside");
        btnMenu.addEventListener('click', () => {
            aside.classList.toggle("oculto");
        });

        //CODIGO PARA BUSQUEDA DE DNI
        buscarDni = () => {
            dniInput = document.getElementById('dni');
            nombresInput = document.getElementById('nombreCompleto');
            dniCliente = document.getElementById("dniCliente");
            fetch("/buscarDni", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "dni=" + dniInput.value
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: "DNI no encontrado"
                        });
                        nombresInput.value = "";
                    } else {
                        dniCliente.value = data.dni;
                        nombresInput.value = data.nombres + " " + data.apellidos;
                    }
                })
        }
        //CODIGO PARA CAMPO DEPORTIVO Y PRECIO DE CAMPO
        const selectCampo = document.getElementById("campo");
        const inputPrecio = document.getElementById("precio");

        selectCampo.addEventListener("change", function () {

            const opcionElegida = this.options[this.selectedIndex];
            const precio = opcionElegida.dataset.precio;
            //Obtendra el idCampo
            campoSeleccionado = this.value;
            inputPrecio.value = precio;
            calendar.refetchEvents();
        });


        //CODIGO PARA FORMULARIO RESERVA
        const reservaForm = document.getElementById('reservaForm');

        reservaForm.addEventListener('submit', function (event) {

            event.preventDefault(); // Evita recargar la página

            // Enviar datos con AJAX
            const formData = new FormData(reservaForm);

            fetch('/admin/reservar', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {

                    if (data.success) {

                        Swal.fire({
                            icon: 'success',
                            title: 'Reserva Exitosa',
                            text: data.message,
                            confirmButtonText: 'Aceptar'
                        }).then(() => {

                            // Limpiar formulario
                            reservaForm.reset();
                            location.reload();
                        });

                    } else {

                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: data.message
                        });

                    }

                })
                .catch(error => {

                    Swal.fire({
                        icon: 'error',
                        title: 'Error del servidor',
                        text: error
                    });

                });

        });
    </script>
</body>

</html>
