<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/AdminStyle.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" th:href="@{/img/iconDeporPlaza.png}">
    <title>Buscar Reservas - DeporPlaza</title>
</head>

<body>
    <div th:replace="~{fragments/header::header}"></div>
    <main>
        <div th:replace="~{fragments/aside::aside}"></div>
        <section>
            <div class="title-form">Buscar Reserva</div>
            <div class="bloque">
                <form id="busquedaReservaForm" class="mb-3">
                    <div class="mb-3 input-dniBusqueda">
                        <label class="form-label">Por DNI</label>
                        <input type="text" placeholder="DNI" id="dniBusqueda" class="form-control"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="8" pattern="[0-9]{8}"
                            required>
                    </div>
                    <div class="input-apellidosBusqueda mb-3">
                        <label class="form-label">Por Apellidos</label>
                        <input id="apellidosBusqueda" type="text" class="form-control"
                            placeholder="Ingrese el nombre del campo...">
                    </div>
                    <div class="mb-3 input-campoBusqueda">
                        <label class="form-label">Por Campo Deportivo</label>
                        <select class="form-select" name="idCampo" id="idCampo" required>
                            <option value="" selected>TODOS</option>
                            <option th:each="p:${campos}" th:value="${p.idCampo}" th:text="${p.nombreCampo}"
                                th:data-precio="${p.precioHora}">
                            </option>
                        </select>
                    </div>
                    <div class="input-fechaBusqueda mb-3">
                        <label class="form-label">Por Fecha de Reserva</label>
                        <input type="date" id="fechaBusqueda" class="form-control">
                    </div>
                    <div class="input-estadoBusqueda mb-3">
                        <label class="form-label">Por Estado</label>
                        <select id="estadoBusqueda" class="form-select">
                            <option value="" selected>TODOS</option>
                            <option value="RESERVADO">RESERVADO</option>
                            <option value="CANCELADO">CANCELADO</option>
                        </select>
                    </div>

                    <div class="contenedor-btn d-flex gap-3 mb-3">
                        <a id="btnBusqueda" onclick="buscarReservas()" class="btn btn-success">
                            <i class="bi bi-search"></i>
                        </a>
                        <a id="btnLimpiarBusqueda" onclick="limpiarBusqueda()" class="btn btn-info">
                            <i class="bi bi-arrow-clockwise"></i>
                        </a>
                    </div>
                </form>
                <div class="table-responsive">
                    <table id="tablaCampo" class="table table-striped table-hover border border-2">
                        <thead>
                            <tr>
                                <th class="text-center">ID</th>
                                <th class="text-center">DNI</th>
                                <th class="text-center">Apellidos y Nombres</th>
                                <th class="text-center">Campo Deportivo</th>
                                <th class="text-center">Fecha de Reserva</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReservaBody">

                        </tbody>
                    </table>

                </div>
            </div>
        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- SCRIPT DE BOOSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        //se pone en comentario para evitar errores, THYMELEAF  toma en cuenta lo que esta entre /**/
        const listaHorarios = /*[[${horarios}]]*/[];
        const listaCampos = /*[[${campos }]];*/[];
    </script>
    <script>
        // CODIGO PARA GENERACION DE CALENDARIO
        document.addEventListener('DOMContentLoaded', function () {
            buscarReservas();

        });
    </script>
    <script>
        //CODIGO PARA CERRAR SESION
        function salir() {
            Swal.fire({
                title: "¿Estas seguro?",
                text: "Cerraras la sesion actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#1e7c52",
                cancelButtonColor: "#d33",
                confirmButtonText: "Si, deseo salir"
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/logout', { method: 'POST' });
                    window.location.href = "/";
                }
            });
        };

        //CODIGO PARA OCULTAR ASIDE
        const btnMenu = document.getElementById("btn-menu");
        const aside = document.getElementById("aside");
        btnMenu.addEventListener('click', () => {
            aside.classList.toggle("oculto");
        });


        function buscarReservas() {
            const dniBusqueda = document.getElementById("dniBusqueda").value;
            const apellidosBusqueda = document.getElementById("apellidosBusqueda").value;
            const campo = document.getElementById("idCampo").value;
            const fechaBusqueda = document.getElementById("fechaBusqueda").value;
            const estadoBusqueda = document.getElementById("estadoBusqueda").value;
            fetch(`/admin/busquedaReservas?dni=${dniBusqueda}&apellidos=${apellidosBusqueda}&idCampo=${campo}&fechaReserva=${fechaBusqueda}&estado=${estadoBusqueda}`, { method: "GET" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        cargarTablaReserva(data.reservas);
                    }
                })
        }
        function cargarTablaReserva(reservas) {
            const tablaReservaBody = document.getElementById("tablaReservaBody");
            tablaReservaBody.innerHTML = "";
            let html = "";
            reservas.forEach(item => {
                html +=
                    `
                            <tr class="align-middle">
                                <td class="text-center">${item.idReserva}</td>
                                <td class="text-center">${item.usuario.dni}</td>
                                <td class="text-center">${item.usuario.apellidos} ${item.usuario.nombres}</td>
                                <td class="text-center">${item.campo.nombreCampo}</td>
                                <td class="text-center">${item.fechaReserva}</td>
                                <td class="text-center">${item.estado}</td>
                                <td class="text-center">
                                ${item.estado === "RESERVADO" ?
                                `
                                    <button type="button" class="btn btn-danger" onclick="cancelarReserva(${item.idReserva})">
                                        <i class="bi bi-ban"></i>
                                    </button>`
                                :
                                    `<span class="badge bg-secondary">Sin acciones</span>`
                                }
                                </td>
                            </tr>
                    `;
            });
            tablaReservaBody.innerHTML = html;
        }
        function limpiarBusqueda() {
            document.getElementById("dniBusqueda").value = "";
            document.getElementById("apellidosBusqueda").value = "";
            document.getElementById("idCampo").value = "";
            document.getElementById("fechaBusqueda").value = "";
            document.getElementById("estadoBusqueda").value = "";
            buscarReservas();
        }
        function cancelarReserva(idReserva) {
            Swal.fire({
                title: "¿Cancelar reserva?",
                text: "Esta acción cambiará el estado a CANCELADO.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, cancelar",
                cancelButtonText: "No",
                confirmButtonColor: "#1e7c52",
                cancelButtonColor: "#d33"
            }).then((result) => {

                if (result.isConfirmed) {

                    fetch(`/admin/cancelarReserva/${idReserva}`, {
                        method: "PUT"
                    })
                        .then(response => response.json())
                        .then(data => {

                            if (data.success) {

                                Swal.fire({
                                    icon: "success",
                                    title: "Reserva cancelada",
                                    text: data.message
                                });

                                buscarReservas(); //Recarga la tabla

                            } else {

                                Swal.fire({
                                    icon: "error",
                                    title: "Error al cancelar",
                                    text: data.message
                                });

                            }

                        });

                }

            });
        }


    </script>
</body>

</html>
