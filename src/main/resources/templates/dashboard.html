<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/AdminStyle.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/img/iconDeporPlaza.png}">
    <title>Dashboard - DeporPlaza</title>
</head>

<body>
    <div th:replace="~{fragments/header::header}"></div>
    <main>
        <div th:replace="~{fragments/aside::aside}"></div>
        <section>
            <div class="title-form">Dashboard</div>
            <div class="bloque">
                <div class="container-fluid py-4">

                    <div class="mb-4">
                        <h2 class="fw-bold"></h2>
                        <p class="title-form">Bienvenido al panel administrativo de DeporPlaza.</p>
                    </div>

                    <!-- Tarjetas -->
                    <div class="row g-3 mb-4">

                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">

                                    <small class="text-muted">
                                        Usuarios
                                    </small>

                                    <h2 class="fw-bold mt-2" id="totalUsuarios">
                                        0
                                    </h2>

                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">

                                    <small class="text-muted">
                                        Campos Deportivos
                                    </small>

                                    <h2 class="fw-bold mt-2" id="totalCampos">
                                        0
                                    </h2>

                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">

                                    <small class="text-muted">
                                        Reservas
                                    </small>

                                    <h2 class="fw-bold mt-2" id="totalReservas">
                                        0
                                    </h2>

                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Graficos -->
                    <div class="row g-4">

                        <div class="col-lg-8">

                            <div class="card shadow-sm border-0">

                                <div class="card-header bg-white">
                                    <h5 class="mb-0">
                                        Reservas por Mes
                                    </h5>
                                </div>

                                <div class="card-body">

                                    <canvas id="graficoReservasMes"></canvas>

                                </div>

                            </div>

                        </div>

                        <div class="col-lg-4">

                            <div class="card shadow-sm border-0">

                                <div class="card-header bg-white">
                                    <h5 class="mb-0">
                                        Reservas por Tipo
                                    </h5>
                                </div>

                                <div class="card-body">

                                    <canvas id="graficoTipos"></canvas>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="row mt-4 g-4">

                        <div class="col-lg-8">

                            <div class="card shadow-sm border-0">

                                <div class="card-header bg-white">
                                    <h5 class="mb-0">
                                        Últimas Reservas
                                    </h5>
                                </div>

                                <div class="card-body table-responsive">

                                    <table class="table table-hover align-middle">

                                        <thead>

                                            <tr>
                                                <th class="text-center">DNI Cliente</th>
                                                <th class="text-center">Campo</th>
                                                <th class="text-center">Fecha</th>
                                                <th class="text-center">Hora</th>
                                                <th class="text-center">Estado</th>
                                            </tr>

                                        </thead>

                                        <tbody id="tablaUltimasReservas">

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                        <div class="col-lg-4">

                            <div class="card shadow-sm border-0">

                                <div class="card-header bg-white">
                                    <h5 class="mb-0">
                                        Usuarios por Mes
                                    </h5>
                                </div>

                                <div class="card-body">

                                    <canvas id="graficoUsuariosMes"></canvas>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- SCRIPT DE BOOSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">

    </script>

    <script>
        //CODIGO PARA CERRAR SESION
        function salir() {
            Swal.fire({
                title: "¿Estas seguro?",
                text: "Cerraras la sesion actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#1e7c52",
                cancelButtonColor: "#d33",
                confirmButtonText: "Si, deseo salir"
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/logout', { method: 'POST' });
                    window.location.href = "/";
                }
            });
        };
        //CODIGO PARA OCULTAR ASIDE
        const btnMenu = document.getElementById("btn-menu");
        const aside = document.getElementById("aside");
        btnMenu.addEventListener('click', () => {
            aside.classList.toggle("oculto");
        });
    </script>
    <script th:inline="javascript">
        function cargarContadores() {
            document.getElementById("totalUsuarios").textContent = /*[[${totalUsuarios}]]*/1;
            document.getElementById("totalCampos").textContent = /*[[${totalCampos}]]*/0;
            document.getElementById("totalReservas").textContent = /*[[${totalReservas}]]*/0;
        }
        function cargarTablaUltimasReservas() {
            const body = document.getElementById("tablaUltimasReservas");
            body.innerHTML = "";
            html = ""
            let ultimasReservas = /*[[${ultimasReservas}]]*/[];
            ultimasReservas.forEach(item => {
                html +=
                    `
                            <tr  class="align-middle">
                                <td class="text-center">${item.usuario.dni}</td>
                                <td class="text-center">${item.campo.nombreCampo}</td>
                                <td class="text-center">${item.fechaReserva}</td>
                                <td class="text-center">${item.horario.horaInicio}</td>
                                <td class="text-center">${item.estado}</td>
                            </tr>
                                `;
            });
            body.innerHTML = html;
        }
        //CANVAS graficoReservasTipo
        function cargarReservasPorTipo() {
            let reservasPorTipo = /*[[${reservasPorTipo}]]*/[];
            let labels = [];
            let datos = [];
            reservasPorTipo.forEach(item => {
                labels.push(item[0]); // nombre del tipo
                datos.push(item[1]);  // cantidad
            })

            const ctx = document.getElementById("graficoTipos");

            new Chart(ctx, {
                type: "doughnut",
                data: {
                    labels: labels,
                    datasets: [{
                        data: datos,
                        backgroundColor: [
                            "#198754",
                            "#0d6efd",
                            "#ffc107",
                            "#dc3545",
                            "#6f42c1",
                            "#20c997"
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: "bottom"
                        }
                    }
                }
            });
        }
        //CANVAS graficosUsuariosMes
        function cargarUsuariosPorMes() {
            let usuariosPorMes = /*[[${usuariosPorMes}]]*/[];
            const nombresMeses = [
                "",
                "Enero",
                "Febrero",
                "Marzo",
                "Abril",
                "Mayo",
                "Junio",
                "Julio",
                "Agosto",
                "Septiembre",
                "Octubre",
                "Noviembre",
                "Diciembre"
            ];

            let labels = [];
            let datos = [];

            usuariosPorMes.forEach(item => {
                labels.push(nombresMeses[item[0]]);
                datos.push(item[1]);
            });

            const ctx = document.getElementById("graficoUsuariosMes");

            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Usuarios Registrados Por Mes",
                        data: datos,
                        backgroundColor: "#198754",
                        borderColor: "#146c43",
                        borderWidth: 1,

                    }]
                },

                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        },

                    }
                }
            });

        }
        //CANVAS graficoReservasMes 
        function cargarReservasPorMes() {
            let reservasPorMes = /*[[${reservasPorMes}]]*/[];
            const nombresMeses = [
                "",
                "Enero",
                "Febrero",
                "Marzo",
                "Abril",
                "Mayo",
                "Junio",
                "Julio",
                "Agosto",
                "Septiembre",
                "Octubre",
                "Noviembre",
                "Diciembre"
            ];

            let labels = [];
            let datos = [];

            reservasPorMes.forEach(item => {
                labels.push(nombresMeses[item[0]]);
                datos.push(item[1]);
            });

            const ctx = document.getElementById("graficoReservasMes");

            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Reservas Por Mes",
                        data: datos,
                        backgroundColor: "#198754",
                        borderColor: "#146c43",
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });

        }

    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarContadores();
            cargarTablaUltimasReservas();
            cargarReservasPorMes();
            cargarReservasPorTipo();
            cargarUsuariosPorMes();
        })
    </script>
</body>

</html>
