<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminStyle.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestionar Campos Deportivos - DeporPlaza</title>
    <link rel="icon" th:href="@{/img/iconDeporPlaza.png}">

</head>

<body>
    <div th:replace="~{fragments/header::header}"></div>
    <main>
        <div th:replace="~{fragments/aside::aside}"></div>
        <section>
            <div class="title-form">Gestionar Usuarios</div>
            <div class="bloque">
                <form th:object="${usuario}" class="formulario" id="usuarioForm" method="post">
                    <div class="mb-3 input-dni">
                        <input id="idUsuario" th:field="*{idUsuario}" type="text" hidden>
                        <label class="form-label">DNI</label>
                        <div class="input-group">
                            <input type="text" placeholder="DNI" id="dni" name="dni" class="form-control"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="8" pattern="[0-9]{8}"
                                required>
                            <input type="hidden" id="dniCliente" name="dniCliente">
                            <button class="btn btn-outline-secondary btnGroup" type="button" onclick="buscarDni()"><i
                                    class="bi bi-search"></i></button>
                        </div>
                    </div>
                    <div class="mb-3 input-nombres">
                        <label class="form-label">Nombres</label>
                        <input type="text" placeholder="Ingrese su DNI..." class="form-control" id="nombres"
                            th:field="*{nombres}" required readonly tabindex="-1">
                    </div>
                    <div class="mb-3 input-apellidos">
                        <label class="form-label">Apellidos</label>
                        <input type="text" placeholder="Ingrese su DNI..." class="form-control" id="apellidos"
                            th:field="*{apellidos}" required readonly tabindex="-1">
                    </div>
                    <div class="mb-3 input-correo">
                        <label class="form-label">Correo</label>
                        <input type="email" placeholder="Ingrese su correo..." class="form-control" id="email"
                            th:field="*{email}" required>
                    </div>
                    <div class="mb-3 input-password">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" th:field="*{password}" placeholder="Ingrese su contraseña"
                                class="form-control" id="passwordRegister" required oninput="soloPassword(this)">
                            <button class="btn btn-outline-secondary btnGroup" type="button"
                                onclick="mostrarPassword()"><i id="passwordIconoRegister"
                                    class="bi bi-eye-fill"></i></button>
                        </div>
                    </div>
                    <div class="mb-3 input-passwordC">
                        <label class="form-label">Confirmar Contraseña</label>
                        <div class="input-group">
                            <input type="password" placeholder="Confirme su contraseña" class="form-control"
                                id="confirmPassword" required oninput="soloPassword(this)">
                            <button class="btn btn-outline-secondary btnGroup" type="button"
                                onclick="mostrarPassword()"><i id="confirmPasswordIcono"
                                    class="bi bi-eye-fill"></i></button>
                        </div>

                    </div>
                    <div class="mb-3 input-telefono">
                        <label class="form-label">Telefono</label>
                        <input type="text" th:field="*{telefono}" placeholder="Ingrese su número de teléfono"
                            class="form-control" id="telefono" oninput="soloNum()" required>
                    </div>
                    <div class="mb-3 input-estado">
                        <label class="form-label">Estado</label>
                        <select id="estado" th:field=*{estado} class="form-select" required>
                            <option value="" disabled selected>---Elegir---</option>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>
                    </div>
                    <div class="mb-3 input-rol">
                        <label class="form-label">Rol</label>
                        <select class="form-select" name="idRol" id="rol" required>
                            <option value="" disabled selected>---Elegir---</option>
                            <option th:each="p:${roles}" th:value="${p.idRol}" th:text="${p.nombreRol}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3 btn-contenedor">
                        <button id="btnSave" class="btn btn-success">Guardar</button>
                        <a onclick="limpiar()" class="btn btn-danger">Limpiar</a>
                    </div>

                </form>

                <div class="title-form mb-3">Filtrar registros:
                </div>
                <form id="busquedaForm" class="mb-3 d-flex flex-row justify-content-between gap-1">
                    <div class="input-dniBusqueda">
                        <label class="form-label">Por DNI</label>
                        <input id="dniBusqueda" type="text" class="form-control" placeholder="Ingrese el DNI...">
                    </div>
                    <div class="input-apellidosBusqueda">
                        <label class="form-label">Por Apellidos</label>
                        <input id="apellidosBusqueda" type="text" class="form-control"
                            placeholder="Ingrese los Apellidos...">
                    </div>
                    <div class="input-emailBusqueda">
                        <label class="form-label">Por Correo</label>
                        <input id="emailBusqueda" type="email" class="form-control" placeholder="Ingrese el correo...">
                    </div>
                    <div class="input-telefonoBusqueda">
                        <label class="form-label">Por Telefono</label>
                        <input id="telefonoBusqueda" type="text" class="form-control"
                            placeholder="Ingrese número de telefono...">
                    </div>
                    <div class=" input-rolBusqueda">
                        <label class="form-label">Por Rol</label>
                        <select id="rolBusqueda" class="form-select">
                            <option value="" selected>TODOS</option>
                            <option th:each="p:${roles}" th:value="${p.idRol}" th:text="${p.nombreRol}">
                            </option>
                        </select>
                    </div>
                    <div class=" input-estadoBusqueda">
                        <label class="form-label">Por Estado</label>
                        <select id="estadoBusqueda" class="form-select">
                            <option value="" selected>TODOS</option>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>

                    </div>
                    <div class="contenedor-btn d-flex gap-3 ">
                        <a id="btnBusqueda" onclick="buscar()" class="btn btn-success">
                            <i class="bi bi-search"></i>
                        </a>
                        <a id="btnLimpiarBusqueda" onclick="limpiarBusqueda()" class="btn btn-info">
                            <i class="bi bi-arrow-clockwise"></i>
                        </a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table id="tablaUsuario" class="table table-striped table-hover border border-2">
                        <thead>
                            <tr>
                                <th class="text-center">Acciones</th>
                                <th class="text-center">ID</th>
                                <th class="text-center">DNI</th>
                                <th class="text-center">Nombres Completos</th>
                                <th class="text-center">Correo</th>
                                <th class="text-center">Rol</th>
                                <th class="text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarioBody">
                        </tbody>
                    </table>

                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- SCRIPT DE BOOSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
    <script th:inline="javascript">

        let modoEdicion = false;
    </script>
    <script>
        //Funcion para validar solo números
        soloNum = () => {
            const telefonoInput = document.getElementById('telefono');
            telefonoInput.value = telefonoInput.value.replace(/[^0-9]/g, '');
        };
        //Funcion para validar la contraseña
        soloPassword = (input) => {
            input.value = input.value.replace(
                /[^A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/g,
                ''
            );
        };
        //Mostrar la password
        mostrarPassword = () => {
            const passwordLogin = document.getElementById('passwordLogin');
            const passwordRegister = document.getElementById('passwordRegister');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordIconoLogin = document.getElementById('passwordIconoLogin');
            const passwordIconoRegister = document.getElementById('passwordIconoRegister');
            const confirmPasswordIcono = document.getElementById('confirmPasswordIcono');

            if (passwordRegister.type === 'password' || passwordLogin.type === 'password' || confirmPasswordInput.type === 'password') {
                passwordRegister.type = 'text';
                passwordLogin.type = 'text';
                confirmPasswordInput.type = 'text';

                passwordIconoLogin.classList.remove('bi-eye-fill');
                passwordIconoLogin.classList.add('bi-eye-slash-fill');

                passwordIconoRegister.classList.remove('bi-eye-fill');
                passwordIconoRegister.classList.add('bi-eye-slash-fill');
                confirmPasswordIcono.classList.remove('bi-eye-fill');
                confirmPasswordIcono.classList.add('bi-eye-slash-fill');
            } else {
                passwordLogin.type = 'password';
                passwordRegister.type = 'password';
                confirmPasswordInput.type = 'password';
                passwordIconoLogin.classList.remove('bi-eye-slash-fill');
                passwordIconoLogin.classList.add('bi-eye-fill');

                passwordIconoRegister.classList.remove('bi-eye-slash-fill');
                passwordIconoRegister.classList.add('bi-eye-fill');
                confirmPasswordIcono.classList.remove('bi-eye-slash-fill');
                confirmPasswordIcono.classList.add('bi-eye-fill');
            }
        }
        //Buscar dni
        buscarDni = () => {
            dniInput = document.getElementById('dni');
            nombresInput = document.getElementById('nombres');
            apellidosInput = document.getElementById('apellidos');
            fetch("/buscarDniRegistro", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "dni=" + dniInput.value
            })
                .then(response => response.json())
                .then(data => {
                    console.log(data)
                    if (data.error) {
                        console.error(data.error);
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: data.error
                        });
                        nombresInput.value = "";
                        apellidosInput.value = "";
                    } else {
                        nombresInput.value = data.nombres;
                        apellidosInput.value = data.apellidos;
                    }
                })
        }
        const inputCorreo = document.getElementById("email");

        inputCorreo.addEventListener("blur", () => {
            const correo = inputCorreo.value;
            console.log(correo)
            fetch(`/buscarEmail?correo=${correo}`, {
                method: 'GET'
            })
                .then(response => response.json())
                .then(data => {

                    if (data.error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: data.error
                        });
                        inputCorreo.value = "";
                    }

                })
                .catch(error => {

                    Swal.fire({
                        icon: 'error',
                        title: 'Error del servidor',
                        text: error
                    });

                });

        });

    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            obtenerUsuarios();
        })
        //CODIGO PARA CERRAR SESION
        const formLogout = document.getElementById("logoutForm")
        formLogout.addEventListener('submit', (e) => {
            e.preventDefault();
            Swal.fire({
                title: "¿Estas seguro?",
                text: "Cerraras la sesion actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#1e7c52",
                cancelButtonColor: "#d33",
                confirmButtonText: "Si, deseo salir"
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById("logoutForm").submit();
                }
            });
        })
        //CODIGO PARA OCULTAR ASIDE
        const btnMenu = document.getElementById("btn-menu");
        const aside = document.getElementById("aside");
        btnMenu.addEventListener('click', () => {
            aside.classList.toggle("oculto");
        });

        //CODIGO PARA FORMULARIO USUARIO
        const usuarioForm = document.getElementById('usuarioForm');

        usuarioForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const idRol = document.getElementById("rol");
            const formDataRegister = new FormData(usuarioForm);
            if (!modoEdicion) {
                const passwordInput = document.getElementById('passwordRegister');
                const confirmPasswordInput = document.getElementById('confirmPassword');
                if (passwordInput.value !== confirmPasswordInput.value) {
                    Swal.fire({
                        icon: "warning",
                        title: "Las Contraseñas no coinciden",
                    });
                    return;
                }
            }
            fetch(`/admin/registrarUsuario?idRol=${idRol.value}`, {
                method: "POST",

                body: formDataRegister
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: data.error,
                            heightAuto: false
                        });
                        usuarioForm.reset();
                    } else {
                        Swal.fire({
                            icon: "success",
                            title: (modoEdicion) ? "Editado" : "Registrado",
                            text: data.success,
                            heightAuto: false
                        }).then(() => {
                            usuarioForm.reset();
                            obtenerUsuarios();
                            const botonSave = document.getElementById("btnSave")
                            botonSave.textContent = "Guardar";
                            botonSave.classList.remove('btn-warning');
                            botonSave.classList.add('btn-success');
                        })
                    }
                });
        });
        //CARGAR TABLAS
        function obtenerUsuarios() {
            fetch("/admin/obtenerUsuarios", { method: "GET" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let datos = []
                        datos = data.usuarios;
                        cargarTablaUsuario("tablaUsuarioBody", datos);
                    } else {
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: data.message
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        icon: "error",
                        title: "Error del servidor",
                        text: error
                    });
                });
        }
        function cargarTablaUsuario(idTablaBody, datos) {
            const tablaUsuarioBody = document.getElementById("tablaUsuarioBody");
            tablaUsuarioBody.innerHTML = ""
            let html = "";
            datos.forEach(item => {
                html +=
                    `
                            <tr  class="align-middle">
                                <td class="text-center">
                                    <a onclick='cargarEdicionUsuario(${item.idUsuario})' class="btn btn-warning">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <button type="button" class="btn btn-danger"
                                        onclick='eliminarUsuario(${item.idUsuario})'>
                                        <i class="bi bi-trash-fill"></i>
                                    </button>
                                </td>
                                <td  class="text-center">${item.idUsuario}</td>
                                <td class="text-center">${item.dni}</td>
                                <td >${item.apellidos} ${item.nombres}</td>
                                <td >${item.email}</td>
                                <td class="text-center">${item.rol.nombreRol}</td>
                                <td class="text-center">${item.estado}</td>
                            </tr>
                                `;
            });
            tablaUsuarioBody.innerHTML = html;
        }
        //Cargar datos del usuario
        function cargarEdicionUsuario(idUsuario) {
            const botonSave = document.getElementById("btnSave")
            const inputid = document.getElementById('idUsuario')
            const inputDni = document.getElementById('dni')
            const inputNombres = document.getElementById('nombres')
            const inputApellidos = document.getElementById('apellidos')
            const inputEmail = document.getElementById('email')
            const divPassword = document.getElementsByClassName('input-password')[0];
            const divPasswordC = document.getElementsByClassName('input-passwordC')[0];
            const inputPassword = document.getElementById("passwordRegister");
            const inputPasswordC = document.getElementById("confirmPassword");
            const inputTelefono = document.getElementById('telefono')
            const inputEstado = document.getElementById('estado')
            const inputRol = document.getElementById('rol')
            divPassword.hidden = true;
            divPasswordC.hidden = true;
            inputPassword.required = false;
            inputPasswordC.required = false;
            botonSave.textContent = "Editar";
            botonSave.classList.add('btn-warning', 'text-white');
            botonSave.classList.remove('btn-success');
            fetch(`/admin/obtenerUsuarioById?idUsuario=${idUsuario}`, { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    modoEdicion = true;
                    const usuarioEditar = data.usuario;
                    inputid.value = usuarioEditar.idUsuario;
                    inputDni.value = usuarioEditar.dni;
                    inputNombres.value = usuarioEditar.nombres;
                    inputApellidos.value = usuarioEditar.apellidos;
                    inputEmail.value = usuarioEditar.email;
                    inputTelefono.value = usuarioEditar.telefono;
                    inputEstado.value = usuarioEditar.estado;
                    inputRol.value = usuarioEditar.rol.idRol;
                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                })
                .catch(error => {

                    Swal.fire({
                        icon: 'error',
                        title: 'Error del servidor',
                        text: error
                    });

                });
        }
        // Eliminar un Campo
        function eliminarUsuario(idUsuario) {
            Swal.fire({
                icon: 'warning',
                title: '¿Eliminar campo?',
                text: 'Esta acción no se puede deshacer.',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#d33',
                cancelButtonColor: "#0d6efd"
            }).then((result) => {

                if (result.isConfirmed) {

                    fetch(`/admin/eliminarUsuarioPorId?idUsuario=${idUsuario}`, {
                        method: 'POST'
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Usuario eliminado',
                                    text: data.message
                                }).then(() => {
                                    location.reload();
                                });

                            } else {

                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: data.message
                                });

                            }

                        })
                        .catch(error => {

                            Swal.fire({
                                icon: 'error',
                                title: 'Error del servidor',
                                text: error
                            });

                        });

                }

            });

        }

        function buscar() {
            const tablaBody = document.getElementById("tablaUsuarioBody");
            const dniBusqueda = document.getElementById("dniBusqueda").value;
            const apellidosBusqueda = document.getElementById("apellidosBusqueda").value;
            const emailBusqueda = document.getElementById("emailBusqueda").value;
            const telefonoBusqueda = document.getElementById("telefonoBusqueda").value;
            const rolBusqueda = document.getElementById("rolBusqueda").value;
            const estadoSelect = document.getElementById("estadoBusqueda").value
            fetch(`/admin/busquedaUsuario?dni=${dniBusqueda}&apellidos=${apellidosBusqueda}&email=${emailBusqueda}&telefono=${telefonoBusqueda}&rol=${rolBusqueda}&estado=${estadoSelect}`)
                .then(response => response.json())
                .then(data => {
                    datos = data.usuarios;
                    cargarTablaUsuario("tablaUsuarioBody", datos);

                });
        }
        function limpiarBusqueda() {
            const dniBusqueda = document.getElementById("dniBusqueda")
            const apellidosBusqueda = document.getElementById("apellidosBusqueda");
            const emailBusqueda = document.getElementById("emailBusqueda");
            const telefonoBusqueda = document.getElementById("telefonoBusqueda");
            const rolBusqueda = document.getElementById("rolBusqueda");
            const estadoSelect = document.getElementById("estadoBusqueda")
            const estadoBusqueda = estadoSelect.value === "" ? "" : estadoSelect.options[estadoSelect.selectedIndex].text;
            dniBusqueda.value = "";
            apellidosBusqueda.value = "";
            emailBusqueda.value = "";
            telefonoBusqueda.value = "";
            rolBusqueda.selectedIndex = 0;
            estadoSelect.selectedIndex = 0;
            obtenerUsuarios();
        }
        function limpiar() {
            const idCampo = document.getElementById("idCampo");
            const precioHora = document.getElementById("precioHora");
            const tipoC = document.getElementById("tipoC");
            const descripcion = document.getElementById("descripcion");
            const estado = document.getElementById("estado");
            idCampo.value = "";
            precioHora.value = "";
            descripcion.value = "";
            tipoC.selectedIndex = 0;
            estado.selectedIndex = 1;
        }

    </script>
</body>

</html>
